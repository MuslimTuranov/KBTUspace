services:
  frontend:
    build:
      context: ./kbtuspace-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: kbtuspace_frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build:
      context: ./kbtuspace-backend
      dockerfile: Dockerfile
    container_name: kbtuspace_api
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-kbtuspace_user}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-kbtuspace_db}
      - DB_SSLMODE=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@kbtu.kz}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}

  postgres:
    image: postgres:15-alpine
    container_name: kbtuspace_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-kbtuspace_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-kbtuspace_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbtuspace_user -d kbtuspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kbtuspace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
